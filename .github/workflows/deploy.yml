# Deploys main to the production stack, docx-to-pdf-converter-main, then converts the fixture through it.
# Runs as gha-serverless-libreoffice-production. The production environment only allows main.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-serverless-libreoffice-production
          aws-region: ${{ env.AWS_REGION }}
      - run: scripts/deploy-stack.sh main production
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: scripts/verify-stack.sh docx-to-pdf-converter main
      # Kept for failed runs too: the PDF and raw response are the quickest way to see what went wrong.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-main-${{ github.sha }}
          path: verify-output/
          if-no-files-found: ignore
          retention-days: 14
